name: jukejam
description: JukeJam music recommender

publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0              # API calls to FastAPI backend
  shared_preferences: ^2.2.0 # persist user_id across app restarts
  url_launcher: ^6.2.0      # open Spotify OAuth in browser

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
